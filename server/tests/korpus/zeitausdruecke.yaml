# Haertefallkorpus Zeitparser
#
# Dies ist die SPEZIFIKATION der Phasen 2-5, nicht nur eine Testsammlung.
# Faelle, die heute scheitern, sind kein Fehler — sie sind der Auftrag.
#
# Deshalb traegt jeder Fall `ab_phase`: die Umbauphase, ab der er gruen sein
# muss. Der Laeufer unterscheidet damit vier Zustaende:
#
#   erfuellt      besteht, und soll es in dieser Phase        -> gut
#   offen         scheitert, soll es aber noch                -> erwartet
#   REGRESSION    scheitert, sollte laengst bestehen          -> Abbruch
#   vorauseilend  besteht schon vor seiner Phase              -> ab_phase senken
#
# `ab_phase: null` heisst: dokumentierte Luecke, nicht geplant. Diese Faelle
# gehoeren trotzdem hierher — eine bekannte Luecke, die niemand aufschreibt,
# wird irgendwann als neuer Bug wiederentdeckt.
#
# HERKUNFT: Die REG-Faelle sind aus novaberg-tool-timeparser.md REKONSTRUIERT,
# nicht aus der alten 47er-Suite geborgen. Die echten 47 stehen in der
# Git-Historie und sollten von dort geholt und hier eingehaengt werden; jeder
# von ihnen war ein bezahlter Bug. Diese 25 decken die dokumentierten Bloecke
# ab, aber sie kennen die Faelle nicht, die damals wehgetan haben.

meta:
  zone: "Europe/Berlin"
  jetzt: "2026-07-31T14:00:00+02:00"   # Freitag, KW 31
  aktuelle_phase: 2

